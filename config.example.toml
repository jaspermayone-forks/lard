# Lard server configuration
# Copy this to ~/.config/lard/config.toml and edit as needed

# Server settings
addr = ":7477"
db = ""  # defaults to ~/.config/lard/lard.db
memory_dir = ""  # defaults to ~/.config/lard/memory

# LLM client (for /consolidate endpoint)
[llm]
base_url = "https://api.openai.com/v1"
model = "gpt-4o-mini"
api_key = ""  # or set OPENAI_API_KEY env var
api_version = ""

# Authentication
[auth]
mode = "none"  # none, token, or bearer
token = ""  # static token for token mode
indiko_url = "https://indiko.dunkirk.sh"
public_url = ""  # your public URL for OAuth redirects
allowed_client_ids = []  # OAuth client IDs allowed to access
allowed_users = []  # user emails/IDs allowed to access
required_scopes = []  # required OAuth scopes
collector_client_id = ""  # collector's OAuth client ID

# Collector registration (published to edge collectors)
[collector]
client_id = ""  # the OAuth client ID collectors should use
scopes = ["read", "write"]  # scopes granted to collectors

# Auto-consolidation (runs when uploads go quiet)
[consolidate]
after = "5m"  # wait this long after last upload before consolidating
max_wait = "30m"  # but consolidate at least this often
