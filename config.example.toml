# Lard server configuration
# Copy this to ~/.config/lard/config.toml and edit as needed.
# Env vars always win over this file.

# Server settings
addr = ":7477"
db = ""          # defaults to ~/.config/lard/lard.db
memory_dir = ""  # defaults to ~/.config/lard/memory

# Multi-user: every authenticated identity gets its own database and its own
# memory directory under data_dir. Nothing is shared between them. Needs
# auth.mode = "oauth", since that is what puts an identity on the request.
multi_user = false
data_dir = ""      # defaults to ~/.config/lard/users
primary_user = ""  # identity that owns requests carrying no OAuth identity.
                   # On the first multi-user boot, an existing single-user
                   # db + memory_dir are moved into this user's tenant.

# Consolidation model (any OpenAI-compatible endpoint; Hyper is the default)
[llm]
base_url = ""    # defaults to https://hyper.charm.land
model = ""       # defaults to deepseek-v4-flash
api_key = ""     # or set LARD_HYPER_API_KEY / HYPER_API_KEY
api_version = ""

# Authentication
[auth]
mode = "none"          # none, token, or oauth
token = ""             # shared secret for token mode
auth_server = ""       # authorization server URL for oauth mode
public_url = ""        # lard's external URL. It goes in the OAuth metadata and
                       # is the audience every token must name (RFC 8707), so
                       # clients register themselves and no client allowlist is
                       # needed here.
allowed_users = []     # user identity URLs allowed to access
required_scopes = []   # scopes every token must carry
# Shown on the authorization server's consent screen (RFC 9728 metadata).
resource_name = "lard"                                    # friendly name
logo_uri = "https://l4.dunkirk.sh/i/qSu61P7PQtbT.webp"    # icon (or "" for none)

# Auto-consolidation (runs when uploads go quiet)
[consolidate]
after = "5m"     # wait this long after last upload before consolidating
max_wait = "30m" # but consolidate at least this often
